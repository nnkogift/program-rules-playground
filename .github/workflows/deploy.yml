name: Deploy

# Not triggered by `on: release` — GitHub Actions doesn't cascade workflow
# runs from events created with the default GITHUB_TOKEN (anti-recursion
# protection), and changesets/action creates the GitHub Release using that
# token. So this is a reusable workflow release.yml calls directly as a
# job, plus workflow_dispatch for manually re-deploying a given tag.
on:
    workflow_call:
        inputs:
            tag:
                required: true
                type: string
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to deploy, e.g. v0.1.0-alpha.0'
                required: true
                type: string

permissions:
    contents: read

jobs:
    deploy:
        if: contains(inputs.tag, '-alpha.') # TODO: extend once beta/main deploys are wired up
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag }}
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build

            - name: Deploy to demo DHIS2
              env:
                  D2_PASSWORD: ${{ secrets.DHIS2_DEMO_PASSWORD }}
              run: >
                  pnpm run deploy "${{ vars.DHIS2_DEMO_URL }}"
                  --username "${{ secrets.DHIS2_DEMO_USERNAME }}"
