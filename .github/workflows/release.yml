name: Release

on:
    push:
        branches: [alpha] # TODO: add 'beta', 'main' when those channels are wired up

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.changesets.outputs.published }}
            tag: v${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Version or publish
              id: changesets
              uses: changesets/action@v1.9.0
              with:
                  publish: pnpm run release
                  commit: 'chore: version packages (alpha)'
                  title: 'chore: version packages (alpha)'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Read released version
              id: version
              if: steps.changesets.outputs.published == 'true'
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Upload app bundle to the release
              if: steps.changesets.outputs.published == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "v${{ steps.version.outputs.version }}" build/bundle/*.zip --clobber

    # Tells the docs repo about the release: opens a "Docs impact" issue with
    # the changesets' `docs:` notes and any DHIS2 version range change, and
    # triggers its screenshot pipeline. A separate job so a docs-side failure
    # never blocks the deploy. Skips with a warning without DOCS_REPO_TOKEN.
    docs-impact:
        needs: release
        if: needs.release.outputs.published == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  # Tags and history, to diff d2.config.js against the previous release.
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Open docs issue and trigger screenshots
              env:
                  DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
              run: node scripts/docs-impact.mjs

    deploy:
        needs: release
        if: needs.release.outputs.published == 'true'
        uses: ./.github/workflows/deploy.yml
        with:
            tag: ${{ needs.release.outputs.tag }}
        secrets: inherit
